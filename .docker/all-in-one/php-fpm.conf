[www]

; The all-in-one entrypoint exports both the bundled database credentials and
; optional application settings before starting Supervisor. Ubuntu's default
; PHP-FPM pool clears that environment, which makes database.inc.php fall back
; to the repository .env file and report "Database unavailable". Keep the
; container environment available to PHP, as the separate php-fpm image does.
clear_env = no
